version: "1.0"
document:
  input: "sample_cross_run.docx"
  output: "sample_cross_run_edited.docx"

revision:
  author: "Claude AI"
  track_changes: true
  rsid: "00A1B2C3"  # 可选：自定义 RSID

edits:
  # 示例 1: 跨 Run 替换（文本跨越普通和粗体格式）
  # 原始文本可能是: "This is <b>important</b> information"
  # 逻辑文本: "This is important information"
  # 物理结构: <w:r>This is </w:r><w:r><w:b/>important</w:r><w:r> information</w:r>
  - type: replace_partial_cross_run
    description: "修正拼写错误（跨越多个 Run）"
    find_text: "This is important information"
    paragraph_index: 2  # 可选：指定段落索引以提高定位精度
    changes:
      - delete: "important"
        insert: "critical"

  # 示例 2: 删除跨 Run 文本
  - type: replace_partial_cross_run
    description: "删除多余的词语"
    find_text: "very very good"
    changes:
      - delete: "very very "
        insert: ""

  # 示例 3: 多次替换（同一段落）
  - type: replace_partial_cross_run
    description: "批量修正日期格式"
    find_text: "Date: 2024/01/15 to 2024/01/20"
    changes:
      - delete: "2024/01/15"
        insert: "2024-01-15"
      - delete: "2024/01/20"
        insert: "2024-01-20"
