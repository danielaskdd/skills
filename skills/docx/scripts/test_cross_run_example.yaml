version: "1.0"

document:
  input: "test.docx"
  output: "test_revised.docx"

revision:
  author: "Claude"
  track_changes: true
  rsid: ""

edits:
  # Example 1: Simple text replacement
  - type: replace_partial
    description: "Fix typo: recieve → receive"
    find_text: "I will recieve the package tomorrow"
    changes:
      - delete: "recieve"
        insert: "receive"

  # Example 2: Multiple replacements in one operation
  - type: replace_partial
    description: "Update project name"
    find_text: "The OldProject will launch next month"
    changes:
      - delete: "OldProject"
        insert: "NewProject"

  # Example 3: Cross-run text replacement (works automatically!)
  - type: replace_partial
    description: "Fix text spanning formatting boundaries"
    find_text: "This is important text with emphasis"
    changes:
      - delete: "important"
        insert: "critical"

  # Example 4: Delete operation
  - type: delete
    description: "Remove redundant phrase"
    delete: "redundant phrase"

  # Example 5: Insert operation
  - type: insert
    description: "Add missing word"
    find_text: "The system is working"
    position: after
    insert: " properly"

  # Example 6: Add comment
  - type: comment
    description: "Request verification"
    find_text: "The statistics show 95% accuracy"
    comment: "Please verify these statistics with the latest data"
